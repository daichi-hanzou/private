[project]
name = "agentledger"
version = "0.1.0"
description = "Decision-centric audit and exploration framework for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "msal>=1.32,<2",
    "openai>=1.0,<3",
    "pytest>=8,<10",
    "requests>=2.32,<3",
]

[project.scripts]
agentledger = "agentledger.cli:main"
calendar-agent = "calendar_agent.cli:main"
mail-to-calendar = "mail_to_calendar.cli:main"
mail-calendar-orchestrator = "mail_calendar_orchestrator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
