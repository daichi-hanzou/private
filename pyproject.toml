[project]
name = "public-business-planner"
version = "0.1.0"
description = "Evidence-grounded business planning from public company documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68.0",
  "python-dotenv>=1.0.0",
  "pypdf>=5.0.0",
  "openpyxl>=3.1.0",
  "cryptography>=49.0.0",
  "azure-identity>=1.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
business-planner = "business_planner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/business_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
