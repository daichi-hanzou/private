[project]
name = "agentledger"
version = "0.1.0"
description = "Decision-centric audit and exploration framework for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.0,<3", "pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
