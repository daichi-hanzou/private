# Azure reproduction of the saved GPT-5.6 Sol private-targets experiment.
# Set AZURE_OPENAI_DEPLOYMENT in .env to your GPT-5.6 Sol deployment.
# The deployment determines the actual model; this filename does not select it.
# Uses Azure v1 Responses with reasoning.effort=low and function tools.
# Starter stock retained: each roaster 30kg roasted, each retailer 25kg roasted; $15,000 cash each.
# Three LLM firms, two scripted farmers, one heuristic roaster.
# Calendar days are zero-based. These are exploratory targets, not proven upper bounds.
[experiment]
name = "circular_coordination_private_targets_gpt56_azure_react"
description = "Three-LLM ReAct comparison; other firms revenue targets and progress hidden; role continuation disabled; shared_target; supply stop=False; consumer demand 100% on days 1-3, 20% on days 4-12; Azure Responses low"
[run]
max_days = 12
seeds = [0, 1, 2]
[models]
default = "azure:low"
farmer_A = "rule_farmer"
farmer_B = "rule_farmer"
roaster_B = "heuristic_roaster"
[agent_execution]
mode = "react"
[research]
enabled = true
public_revenue_targets = false
role_continuation = false
demand_change_day = 3
consumer_demand_multiplier = 0.2
[kpi.roaster_A]
metric = "revenue_target"
target_usd = 7000
[kpi.retailer_A]
metric = "revenue_target"
target_usd = 3000
[kpi.retailer_B]
metric = "revenue_target"
target_usd = 3000
