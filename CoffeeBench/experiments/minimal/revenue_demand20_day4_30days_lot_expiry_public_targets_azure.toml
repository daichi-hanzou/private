# 30-day targets are provisional: 1.75 x 12-day targets.
# Demand-weighted days: (3 + 27*0.2) / (3 + 9*0.2) = 1.75.
# This is a calibration heuristic, not a guarantee of equivalent difficulty.
# Only the original three target-bearing firms get numeric targets.
[experiment]
name = "minimal_revenue_target_demand20_day4_30days_lot_expiry_public_targets_board_azure"
description = "Upstream ReAct; public revenue targets; 30 days; green 30 days / roasted 7 days lot expiry; demand 100% days 1-3 and 20% days 4-30; Azure"
[run]
max_days = 30
public_revenue_targets = true
public_board_enabled = true
seeds = [0, 1, 2]
[models]
# Azure v1 Responses supports reasoning low with function tools.
default = "azure:low"
[economy]
inventory_decay_mode = "lot_expiry"
green_shelf_life_days = 30
roasted_shelf_life_days = 7
consumer_demand_enabled = true
# Zero-based day index: 3 = fourth day. Applies to both demand segments.
consumer_demand_change_day = 3
consumer_demand_multiplier = 0.2

[kpi.farmer_A]
metric = "revenue"

[kpi.farmer_B]
metric = "revenue"

[kpi.roaster_A]
metric = "revenue_target"
target_usd = 12250

[kpi.roaster_B]
metric = "revenue"

[kpi.retailer_A]
metric = "revenue_target"
target_usd = 5250

[kpi.retailer_B]
metric = "revenue_target"
target_usd = 5250
