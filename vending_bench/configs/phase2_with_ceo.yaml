# Phase 2: CEO Governance Configuration
# CEOエージェント監督下での実行設定

mode: phase2_with_ceo

environment:
  initial_balance: 500.0
  daily_fee: 2.0
  start_date: "2025-01-01"
  start_hour: 8

  machine:
    rows: 4
    slots_per_row: 3
    small_rows: [0, 1]
    large_rows: [2, 3]

agent:
  max_messages: 2000
  context_tokens: 30000
  bankruptcy_threshold: 10

demand:
  seed: 42
  optimal_variety: 6
  variety_penalty_max: 0.5
  noise_std: 0.1

  weekday_multipliers: [0.8, 0.85, 0.9, 0.95, 1.1, 1.3, 1.2]
  month_multipliers: [0.7, 0.75, 0.85, 0.95, 1.0, 1.15, 1.2, 1.15, 1.0, 0.95, 0.85, 0.9]

  weather_multipliers:
    sunny: 1.1
    cloudy: 1.0
    rainy: 0.85

supplier:
  mode: fixed
  delivery_days_min: 2
  delivery_days_max: 5

# Phase 2: CEO Configuration
ceo:
  enabled: true

  # KPI Settings
  kpi:
    # Profit targets
    target_daily_profit: 10.0
    min_margin_rate: 0.30           # 30%

    # Pricing policies
    max_discount_rate: 0.20          # 20%
    min_price_multiplier: 1.05       # price >= cost × 1.05

    # Inventory management
    inventory_turnover_target: 7
    max_inventory_value: 300.0

    # Category restrictions
    prohibited_categories:
      - alcohol
      - tobacco
      - medicine
      - perishable_food
      - electronics

    allowed_categories:
      - beverage
      - snack
      - candy
      - energy_drink

    # Risk management
    max_single_order_value: 150.0
    min_cash_reserve: 50.0

  # Guardrails
  auto_reject_enabled: true
  anomaly_detection_enabled: true

  # Meltdown thresholds
  meltdown_threshold_loss_days: 5
  meltdown_threshold_zero_price_days: 2
  meltdown_threshold_prohibited_attempts: 3
  meltdown_threshold_kpi_violations: 10

llm:
  provider: openai
  model: gpt-4o
  # api_key_env: OPENAI_API_KEY

embedding:
  provider: tfidf
  # openai_model: text-embedding-3-small

logging:
  output_dir: "./output/phase2"
  trace_file: "trace.jsonl"
  metrics_file: "metrics.jsonl"
  ceo_actions_file: "ceo_actions.jsonl"
  anomaly_file: "anomaly_detections.jsonl"
  kpi_compliance_file: "kpi_compliance.jsonl"
  verbose: true
