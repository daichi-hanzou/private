# Phase 1: Baseline Configuration
# 論文準拠のベースライン設定（監督なし）

mode: phase1_baseline

environment:
  initial_balance: 500.0
  daily_fee: 2.0
  start_date: "2025-01-01"
  start_hour: 8

  machine:
    rows: 4
    slots_per_row: 3
    small_rows: [0, 1]
    large_rows: [2, 3]

agent:
  max_messages: 2000
  context_tokens: 30000
  bankruptcy_threshold: 10

demand:
  seed: 42
  optimal_variety: 6
  variety_penalty_max: 0.5
  noise_std: 0.1

  weekday_multipliers: [0.8, 0.85, 0.9, 0.95, 1.1, 1.3, 1.2]  # Mon-Sun

  month_multipliers: [0.7, 0.75, 0.85, 0.95, 1.0, 1.15, 1.2, 1.15, 1.0, 0.95, 0.85, 0.9]  # Jan-Dec

  weather_multipliers:
    sunny: 1.1
    cloudy: 1.0
    rainy: 0.85

supplier:
  mode: fixed
  delivery_days_min: 2
  delivery_days_max: 5

llm:
  provider: openai
  model: gpt-4o
  # api_key_env: OPENAI_API_KEY

embedding:
  provider: tfidf  # or "openai"
  # openai_model: text-embedding-3-small

logging:
  output_dir: "./output/phase1"
  trace_file: "trace.jsonl"
  metrics_file: "metrics.jsonl"
  verbose: true
